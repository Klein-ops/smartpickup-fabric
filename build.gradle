plugins {
    id 'fabric-loom' version '1.12.7'
    id 'java'
}

base {
    archivesName = project.properties['archives_base_name']
}

version = project.properties['mod_version']
group = project.properties['maven_group']

repositories {
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

loom {
    splitEnvironmentSourceSets()
    officialMojangMappings()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.properties['minecraft_version']}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.properties['fabric_loader_version']}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.properties['fabric_api_version']}"
    modCompileOnly "com.terraformersmc:modmenu:${project.properties['modmenu_version']}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}